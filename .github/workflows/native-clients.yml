name: Native Clients

on:
  push:
    tags: ['client-v*']
  workflow_dispatch:
  pull_request:
    paths: ['apps/native/**', '.github/workflows/native-clients.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@sharkord/native' build
      - run: bun run check-types
      - name: Install browser
        working-directory: packages/e2e
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Check native browser integration and themes
        working-directory: packages/e2e
        env:
          SHARKORD_WEBRTC_ANNOUNCED_ADDRESS: 127.0.0.1
        run: |
          bun run seed:e2e
          node node_modules/@playwright/test/cli.js test native-shell.pw.ts themes.pw.ts device-preferences.pw.ts --workers=1 --reporter=line
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@sharkord/native' build
      - name: Test native server and update policies
        working-directory: apps/native/macos
        run: swift test
      - name: Build universal macOS application
        working-directory: apps/native
        run: bun run build:macos
      - name: Test audio between native WebKit clients
        timeout-minutes: 3
        env:
          SHARKORD_WEBRTC_ANNOUNCED_ADDRESS: 127.0.0.1
        run: |
          # native WebKit needs an interface address for local ICE checks.
          export SHARKORD_WEBRTC_ANNOUNCED_ADDRESS="$(python3 -c 'import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.connect(("192.0.2.1",9)); print(s.getsockname()[0]); s.close()')"
          (cd packages/e2e && bun run seed:e2e)
          (cd apps/server && SHARKORD_DATA_PATH="$GITHUB_WORKSPACE/packages/e2e/e2e-data" bun dev) > /tmp/sharkord-server.log 2>&1 &
          server_pid=$!
          (cd apps/client && bun dev) > /tmp/sharkord-client.log 2>&1 &
          client_pid=$!
          trap 'kill "$server_pid" "$client_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/ > /dev/null && curl --fail --silent http://localhost:4991/healthz > /dev/null; then break; fi
            sleep 1
          done
          apps/native/dist/Sharkord.app/Contents/MacOS/Sharkord --smoke-test /tmp/sharkord-voice.json --smoke-url http://localhost:5173/ --smoke-voice-script "$GITHUB_WORKSPACE/apps/native/tests/voice-smoke.js"
          python3 -c 'import json; report=json.load(open("/tmp/sharkord-voice.json")); print(json.dumps(report)); assert report["passed"]'
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: apps/native/dist/Sharkord-macos-universal.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@sharkord/native' build
      - name: Test native server and update policies
        run: dotnet run --project apps/native/windows-tests -c Release
      - name: Test updater file replacement
        shell: pwsh
        run: ./apps/native/windows-tests/UpdaterTransaction.ps1
      - name: Test mediasoup in the actual WebView2 runtime
        timeout-minutes: 3
        shell: pwsh
        run: |
          bun run apps/native/scripts/build-voice-probe.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/EdgeWebView/Application'
          if (-not (Test-Path $runtime)) {
            $installer = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 installer signature' }
            Start-Process $installer -ArgumentList '/silent', '/install' -Wait
          }
          dotnet run --project apps/native/windows-runtime-tests -c Release -- apps/native/dist/voice-probe "$env:RUNNER_TEMP/webview2-voice.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application
        shell: pwsh
        run: |
          $version = (Get-Content apps/native/client-config.json | ConvertFrom-Json).version
          dotnet publish apps/native/windows/Sharkord.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -o apps/native/dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path apps/native/dist/windows/* -DestinationPath apps/native/dist/Sharkord-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: apps/native/dist/Sharkord-windows-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: [checks, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-release
          merge-multiple: true
      - name: Validate version and create update manifest
        working-directory: apps/native
        env:
          CLIENT_TAG: ${{ github.ref_name }}
        run: |
          version=$(bun -e "console.log((await Bun.file('client-config.json').json()).version)")
          test "$CLIENT_TAG" = "client-v$version"
          bun run scripts/release-manifest.ts ../../native-release
      - name: Publish native applications
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$CLIENT_TAG" native-release/* --title "Sharkord Client ${CLIENT_TAG#client-v}" --notes-file apps/native/RELEASE.md --latest=false
