name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun format:check

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun check-types

      - name: Run tests
        run: bun run test

      - name: Build
        working-directory: apps/server
        env:
          SHARKORD_BASE_PATH: /%D0%B3%D0%BE%D0%BB%D0%BE%D1%81
        run: bun run build --target bun-linux-x64-baseline

      - name: Save VPS binary
        uses: actions/upload-artifact@v4
        with:
          name: sharkord-linux-x64
          path: apps/server/build/out/sharkord-linux-x64-baseline
          retention-days: 14
